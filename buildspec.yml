version: 0.2

env:
  parameter-store:
    DOCKER_REGISTRY_USERNAME: /myapp/docker-credentials/username
    DOCKER_REGISTRY_PASSWORD: /myapp/docker-credentials/password
    DOCKER_REGISTRY_URL: /myapp/docker-registry/url

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "[INSTALL] Setting up Node.js and npm registry..."
      - npm config set registry https://registry.npmjs.org/

  pre_build:
    commands:
      - echo "[PRE_BUILD] Logging into Docker Registry..."
      - echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USERNAME" --password-stdin "$DOCKER_REGISTRY_URL"
      - IMAGE_REPO_NAME="tws-online-shop-app-demo"
      - IMAGE_NAME="$DOCKER_REGISTRY_USERNAME/$IMAGE_REPO_NAME"

  build:
    commands:
      - echo "[BUILD] Build started on $(date)"
      - echo "[BUILD] Packaging application into zip file..."
      - zip -r ../online-shop-app.zip .
      - echo "[BUILD] Building Docker image..."
      - docker build -t $IMAGE_NAME:latest .

  # post_build:
  #   commands:
  #     - echo Build completed on `date`
  #     - echo Pushing the Docker image...
  #     - docker push $IMAGE_NAME:latest
  #     - echo Uploading zip file to S3 root location...
  #     - aws s3 cp online-shop-app.zip s3://tws-online-shop-demo/online-shop-app/ # Upload zip file to the root of the bucket
  #     - echo Writing image definitions file...
  #     - printf '{"ImageURI":"%s", "Port":8000}' $IMAGE_NAME:latest > imageDefinitions.json
  #     - cat imageDefinitions.json

post_build:
  commands:
    - echo Build completed on `date`
    - echo Pushing the Docker image...
    - docker push $IMAGE_NAME:latest
    - echo Listing files to confirm zip exists...
    - ls -lh
    - echo Uploading zip file to S3 root location...
    - aws s3 cp online-shop-app.zip s3://tws-online-shop-demo/online-shop-app/

artifacts:
  files:
    - '**/*'
  base-directory: '.'
  discard-paths: no
  exclude-patterns:
    - 'node_modules/**/*'
    - '.git/**/*'
    - '.gitignore'
    - 'README.md'
    - 'package-lock.json'
    - 'online-shop-app.zip'  # Exclude the zip from artifact upload to avoid duplication
